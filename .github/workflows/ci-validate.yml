name: CI Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore src/BancontactPro.Net/BancontactPro.Net.csproj

      - name: Build
        run: dotnet build src/BancontactPro.Net/BancontactPro.Net.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/BancontactPro.Net.Tests/BancontactPro.Net.Tests.csproj -c Release
